name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Test before release
        run: go test ./...

      - name: Build amd64
        run: go build -trimpath -ldflags="-s -w -X main.version=${{ github.ref_name }}" -o pathman-windows-amd64.exe .
        env:
          GOOS: windows
          GOARCH: amd64

      - name: Build arm64
        run: go build -trimpath -ldflags="-s -w -X main.version=${{ github.ref_name }}" -o pathman-windows-arm64.exe .
        env:
          GOOS: windows
          GOARCH: arm64

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            pathman-windows-amd64.exe
            pathman-windows-arm64.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
