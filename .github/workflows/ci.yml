name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly cold run: the Go module cache is skipped, so a clean clone has to
    # build and test without anything warmed by earlier pushes.
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Keyed per event so a manual cold run cannot cancel the push run for the
  # same commit, and a force-push still cancels its own stale run.
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build, vet and test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test with coverage gate
        shell: pwsh
        run: ./scripts/coverage-gate.ps1

      # Keep the profile even when the gate fails: it explains which package
      # dropped and lets a reviewer see the per-function percentages.
      - name: Upload coverage profile
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: warn
          retention-days: 7

  lint:
    name: Lint
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

  vulncheck:
    name: Vulnerability scan
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0

      - name: Run govulncheck
        run: govulncheck ./...
